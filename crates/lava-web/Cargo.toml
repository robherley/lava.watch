[package]
name = "lava-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HTTP server for the canvas-rendered lava lamp web page."

[lib]
name = "lava_web"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }
tracing = "0.1"
anyhow = "1"
