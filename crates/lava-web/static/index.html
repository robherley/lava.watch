<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>lava.watch</title>
    <link
      rel="icon"
      href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌋</text></svg>'
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #000;
        overflow: hidden;
        color: #fff;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      #lava {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: auto;
      }
      #badge {
        position: absolute;
        left: 16px;
        bottom: 16px;
        padding: 4px 10px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        border-radius: 3px;
        opacity: 0;
        transition: opacity 220ms ease-out;
        pointer-events: none;
        user-select: none;
      }
      #badge.show { opacity: 1; }
      .tip {
        position: absolute;
        top: 16px;
        font-size: 12px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.35);
      }
      .tip-left { left: 16px; }
      .tip-right { right: 16px; }
      .tip .cmd { letter-spacing: 0.02em; }
      .tip .cmd::before {
        content: "$ ";
        opacity: 0.55;
      }
      .repo {
        text-decoration: none;
        border-bottom: 1px solid currentColor;
        padding-bottom: 0.5px;
        transition: color 200ms ease-out;
      }
      .repo:hover { color: rgba(255, 255, 255, 0.85); }
    </style>
  </head>
  <body>
    <canvas id="lava"></canvas>
    <div id="badge"></div>
    <div class="tip tip-left">
      <div class="cmd">ssh lava.watch</div>
    </div>
    <a
      class="tip tip-right repo"
      href="https://github.com/robherley/lava"
      target="_blank"
      rel="noopener noreferrer"
      >source code</a
    >
    <script type="module" src="/static/lava.js"></script>
  </body>
</html>
