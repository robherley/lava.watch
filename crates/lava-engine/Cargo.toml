[package]
name = "lava-engine"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless lava lamp simulation + ANSI renderer. Pure Rust, no I/O, WASM-friendly."
build = "build.rs"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
crossterm = "0.28"
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "render"
harness = false
