# Each [[palette]] becomes a `Palette` enum variant + its color stops.
# Order matters: the first entry is the default and also the cycle order
# (left/right arrow keys walk the list).
#
# Color stops are `#RRGGBB` hex (case-insensitive, leading `#` optional).
# `build.rs` parses each into an RGB triple. Add a palette by appending an
# entry — the build script regenerates the enum + lookups.

[[palette]]
name = "classic"
aliases = ["lava", "default"]
bg_top = "#0a0616"
bg_bot = "#160a20"
glow = "#96232d"
cool = "#73161e"
warm = "#ff5f1e"
hot = "#ffe65f"

