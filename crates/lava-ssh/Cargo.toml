[package]
name = "lava-ssh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "SSH server that streams a lava lamp to every connection."

[lib]
name = "lava_ssh"
path = "src/lib.rs"

[[bin]]
name = "lava-ssh"
path = "src/main.rs"

[dependencies]
lava-engine = { path = "../lava-engine" }
russh = "0.60"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
